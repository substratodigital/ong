<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fundação Net do Bem — Pesquisa Institucional (Protótipo V2 com GSAP Micro-Animações)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- GSAP 3 Core -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <style>
    :root {
      --bg-main: #f8faf8;
      --bg-card: #ffffff;
      --bg-sidebar: #fcfdfc;
      --green-primary: #216e43;
      --green-hover: #195634;
      --green-soft: #e6f2eb;
      --green-border: #b6dec5;
      --text-dark: #1d2b24;
      --text-muted: #63736a;
      --border-light: #e5ece8;
      --amber-soft: #fef6e6;
      --amber-text: #b26b00;
      --amber-border: #f8d89c;
      --radius-lg: 14px;
      --radius-md: 10px;
      --shadow-sm: 0 2px 8px rgba(20, 50, 35, 0.04);
      --shadow-md: 0 12px 30px rgba(20, 50, 35, 0.09);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: var(--bg-main);
      color: var(--text-dark);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }

    /* TOP HEADER */
    .top-header {
      height: 68px;
      background: #ffffff;
      border-bottom: 1px solid var(--border-light);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
      position: sticky;
      top: 0;
      z-index: 40;
    }

    .brand-wrap {
      display: flex;
      align-items: center;
      gap: 12px;
      cursor: pointer;
    }

    .brand-logo {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand-heart {
      width: 38px;
      height: 38px;
      border-radius: 10px;
      background: var(--green-soft);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--green-primary);
    }

    .brand-text {
      display: flex;
      flex-direction: column;
      line-height: 1.05;
    }

    .brand-text .fnd {
      font-size: 9px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #4aa56d;
      font-weight: 700;
    }

    .brand-text .main {
      font-size: 19px;
      font-weight: 800;
      color: #28844f;
      letter-spacing: -0.03em;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .view-switcher {
      display: inline-flex;
      background: #f1f5f3;
      padding: 4px;
      border-radius: 999px;
      border: 1px solid var(--border-light);
    }

    .view-btn {
      border: none;
      background: transparent;
      padding: 7px 14px;
      border-radius: 999px;
      font-size: 12.5px;
      font-weight: 600;
      color: var(--text-muted);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: background 0.2s, color 0.2s;
    }

    .view-btn.active {
      background: #ffffff;
      color: var(--green-primary);
      box-shadow: 0 1px 4px rgba(0,0,0,0.06);
    }

    /* MAIN APP LAYOUT */
    .app-layout {
      display: flex;
      flex: 1;
      min-height: calc(100vh - 68px);
    }

    /* LEFT SIDEBAR */
    .sidebar {
      width: 265px;
      background: var(--bg-sidebar);
      border-right: 1px solid var(--border-light);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 20px 14px;
      flex-shrink: 0;
    }

    .sidebar-title {
      font-size: 13px;
      font-weight: 600;
      color: var(--text-muted);
      padding: 0 12px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .sidebar-nav {
      display: flex;
      flex-direction: column;
      gap: 4px;
      overflow-y: auto;
      max-height: calc(100vh - 200px);
    }

    .nav-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 10px 12px;
      border-radius: 10px;
      font-size: 13.5px;
      font-weight: 500;
      color: #4d5d54;
      cursor: pointer;
      border: 1px solid transparent;
      background: transparent;
      text-align: left;
      position: relative;
    }

    .nav-item:hover {
      background: #f0f6f2;
    }

    .nav-item.active {
      background: var(--green-soft);
      color: var(--green-primary);
      font-weight: 700;
    }

    .nav-item-left {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }

    .nav-item-left span {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .nav-status-dot {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 10px;
      flex-shrink: 0;
    }

    .nav-status-dot.done {
      background: #216e43;
      color: #fff;
    }

    .nav-status-dot.progress {
      background: var(--amber-soft);
      border: 1.5px solid var(--amber-text);
      color: var(--amber-text);
    }

    .sidebar-footer {
      padding-top: 14px;
      border-top: 1px solid var(--border-light);
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    /* WORKSPACE RIGHT */
    .workspace {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-width: 0;
    }

    .workspace-topbar {
      padding: 16px 36px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid rgba(229, 236, 232, 0.6);
      background: rgba(255,255,255,0.5);
    }

    .house-selector {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 14px;
      font-weight: 600;
      color: #46574e;
      background: #fff;
      padding: 6px 12px;
      border-radius: 8px;
      border: 1px solid var(--border-light);
    }

    .saved-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      color: #527a63;
      font-weight: 500;
    }

    .workspace-body {
      flex: 1;
      padding: 32px 36px 48px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow-y: auto;
      position: relative;
    }

    /* VIEW 1: COVER SCREEN */
    .cover-container {
      max-width: 680px;
      width: 100%;
      background: #ffffff;
      border: 1px solid var(--border-light);
      border-radius: 20px;
      padding: 44px;
      box-shadow: var(--shadow-md);
      text-align: center;
    }

    .cover-pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 14px;
      background: var(--green-soft);
      color: var(--green-primary);
      border-radius: 999px;
      font-size: 12.5px;
      font-weight: 700;
      margin-bottom: 18px;
    }

    .cover-title {
      font-size: 30px;
      font-weight: 800;
      color: var(--text-dark);
      line-height: 1.2;
      margin-bottom: 14px;
      letter-spacing: -0.02em;
    }

    .cover-desc {
      font-size: 15.5px;
      color: var(--text-muted);
      line-height: 1.6;
      margin-bottom: 28px;
    }

    .cover-highlights {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-bottom: 30px;
      text-align: left;
    }

    .highlight-box {
      background: #f8fbf9;
      border: 1px solid var(--border-light);
      padding: 14px;
      border-radius: 12px;
    }

    .highlight-box strong {
      display: block;
      font-size: 13.5px;
      color: var(--text-dark);
      margin-top: 6px;
    }

    .highlight-box span {
      font-size: 12px;
      color: var(--text-muted);
    }

    /* VIEW 2: CARDS HUB (Com Micro-Animações GSAP) */
    .cards-hub-container {
      max-width: 1120px;
      width: 100%;
    }

    .hub-header {
      background: #ffffff;
      border: 1px solid var(--border-light);
      border-radius: 16px;
      padding: 24px 28px;
      margin-bottom: 24px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      box-shadow: var(--shadow-sm);
    }

    .hub-header-left h2 {
      font-size: 22px;
      font-weight: 800;
      color: var(--text-dark);
      margin-bottom: 6px;
    }

    .hub-header-left p {
      font-size: 14px;
      color: var(--text-muted);
    }

    .hub-stats {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .stat-pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 14px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 700;
    }

    .stat-pill.done {
      background: var(--green-soft);
      color: var(--green-primary);
      border: 1px solid var(--green-border);
    }

    .stat-pill.pending {
      background: #f3f6f4;
      color: #4d5d54;
      border: 1px solid var(--border-light);
    }

    .filter-tabs {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }

    .filter-tabs-left {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .filter-tab {
      padding: 8px 16px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 600;
      border: 1px solid var(--border-light);
      background: #fff;
      color: var(--text-muted);
      cursor: pointer;
    }

    .filter-tab.active {
      background: var(--green-primary);
      color: #fff;
      border-color: var(--green-primary);
    }

    .cards-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(265px, 1fr));
      gap: 18px;
      perspective: 1000px;
    }

    .stage-card {
      background: #ffffff;
      border: 1.5px solid var(--border-light);
      border-radius: 16px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 16px;
      cursor: pointer;
      position: relative;
      box-shadow: var(--shadow-sm);
      overflow: hidden;
      will-change: transform, box-shadow, border-color;
    }

    /* Brilho sutil que acompanha o hover no GSAP */
    .card-glow {
      position: absolute;
      width: 180px;
      height: 180px;
      background: radial-gradient(circle, rgba(33, 110, 67, 0.10) 0%, rgba(33, 110, 67, 0) 70%);
      border-radius: 50%;
      pointer-events: none;
      top: -90px;
      left: -90px;
      opacity: 0;
      z-index: 0;
    }

    .stage-card > * {
      position: relative;
      z-index: 1;
    }

    .stage-card.completed {
      border-color: #9ad4b2;
      background: linear-gradient(180deg, #ffffff 0%, #f4fbf7 100%);
    }

    .stage-card.in_progress {
      border-color: var(--green-primary);
      box-shadow: 0 0 0 3px rgba(33, 110, 67, 0.11);
    }

    .card-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 10px;
    }

    .card-icon-box {
      width: 46px;
      height: 46px;
      border-radius: 12px;
      background: var(--green-soft);
      color: var(--green-primary);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      position: relative;
      will-change: transform;
    }

    .stage-card.pending .card-icon-box {
      background: #f1f5f3;
      color: #5c6e64;
    }

    .card-top-right {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 11.5px;
      font-weight: 700;
      padding: 5px 10px;
      border-radius: 999px;
      will-change: transform;
    }

    .status-badge.completed {
      background: #daf0e3;
      color: #185c37;
    }

    .status-badge.in_progress {
      background: var(--amber-soft);
      color: var(--amber-text);
      border: 1px solid var(--amber-border);
    }

    .status-badge.pending {
      background: #f1f5f3;
      color: #6c7c73;
    }

    /* Botão rápido de demonstrar animação GSAP de Concluído direto no card */
    .quick-complete-btn {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      border: 1px dashed #b5c7bd;
      background: #ffffff;
      color: #63736a;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      title: "Simular conclusão GSAP deste card";
      transition: border-color 0.2s, color 0.2s;
    }

    .quick-complete-btn:hover {
      border-color: var(--green-primary);
      color: var(--green-primary);
      background: var(--green-soft);
    }

    .stage-card.completed .quick-complete-btn {
      border-style: solid;
      border-color: #216e43;
      background: #216e43;
      color: #ffffff;
    }

    .card-StepLabel {
      font-size: 11.5px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--green-primary);
      margin-bottom: 4px;
    }

    .card-title {
      font-size: 16.5px;
      font-weight: 800;
      color: var(--text-dark);
      margin-bottom: 6px;
    }

    .card-desc {
      font-size: 12.5px;
      color: var(--text-muted);
      line-height: 1.45;
    }

    .card-progress-wrap {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .card-progress-meta {
      display: flex;
      justify-content: space-between;
      font-size: 11.5px;
      color: var(--text-muted);
      font-weight: 600;
    }

    .card-progress-bar {
      height: 6px;
      background: #edf2ef;
      border-radius: 999px;
      overflow: hidden;
    }

    .card-progress-fill {
      height: 100%;
      background: var(--green-primary);
      border-radius: 999px;
      width: 0%;
    }

    .card-cta {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      width: 100%;
      padding: 9.5px 12px;
      border-radius: 9px;
      font-size: 13px;
      font-weight: 700;
      border: 1px solid var(--border-light);
      background: #fff;
      color: var(--text-dark);
      cursor: pointer;
    }

    .card-cta-arrow {
      display: inline-flex;
      transition: transform 0.2s;
    }

    .stage-card.in_progress .card-cta {
      background: var(--green-primary);
      color: #fff;
      border-color: var(--green-primary);
    }

    .stage-card.completed .card-cta {
      background: #e9f5ee;
      color: var(--green-primary);
      border-color: #c2e5cf;
    }

    /* Partícula de confete GSAP */
    .gsap-particle {
      position: absolute;
      width: 7px;
      height: 7px;
      border-radius: 50%;
      pointer-events: none;
      z-index: 20;
    }

    /* VIEW 3: QUESTION FORM */
    .question-box {
      max-width: 580px;
      width: 100%;
    }

    .q-header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 18px;
    }

    .q-icon-badge {
      width: 42px;
      height: 42px;
      border-radius: 11px;
      background: var(--green-soft);
      color: var(--green-primary);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .q-block-meta span {
      display: block;
      font-size: 11.5px;
      font-weight: 700;
      color: var(--green-primary);
    }

    .q-block-meta strong {
      font-size: 15px;
      font-weight: 500;
      color: #466c56;
    }

    .q-section-title {
      font-size: 28px;
      font-weight: 800;
      color: var(--text-dark);
      margin-bottom: 22px;
      letter-spacing: -0.02em;
    }

    .q-label {
      display: block;
      font-size: 15.5px;
      font-weight: 700;
      color: var(--text-dark);
      margin-bottom: 10px;
    }

    .q-helper {
      font-size: 13px;
      color: var(--text-muted);
      margin-bottom: 14px;
      line-height: 1.5;
    }

    .q-input, .q-textarea {
      width: 100%;
      padding: 15px 16px;
      border-radius: 10px;
      border: 1.5px solid #cbd5cf;
      background: #ffffff;
      font-family: inherit;
      font-size: 15px;
      color: var(--text-dark);
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .q-input:focus, .q-textarea:focus {
      border-color: var(--green-primary);
      box-shadow: 0 0 0 3px rgba(33, 110, 67, 0.12);
    }

    .q-required {
      display: block;
      text-align: right;
      font-size: 11.5px;
      font-style: italic;
      color: #7c8b83;
      margin-top: 6px;
    }

    .options-stack {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .option-btn {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 18px;
      border-radius: 11px;
      border: 1.5px solid #d5e0da;
      background: #ffffff;
      font-size: 14.5px;
      font-weight: 600;
      color: var(--text-dark);
      cursor: pointer;
      text-align: left;
    }

    .option-btn.selected {
      border-color: var(--green-primary);
      background: var(--green-soft);
      color: var(--green-primary);
    }

    .qa-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
    }

    .qa-counter-card {
      background: #fff;
      border: 1.5px solid var(--border-light);
      border-radius: 12px;
      padding: 12px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .qa-counter-card span {
      font-size: 13.5px;
      font-weight: 600;
    }

    .counter-controls {
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .counter-btn {
      width: 28px;
      height: 28px;
      border-radius: 8px;
      border: 1px solid #cbd5cf;
      background: #f8faf8;
      cursor: pointer;
      font-weight: 700;
    }

    .urgency-scale {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 8px;
      margin-bottom: 16px;
    }

    .urgency-pill {
      padding: 12px 8px;
      border-radius: 10px;
      border: 1.5px solid #d5e0da;
      background: #fff;
      text-align: center;
      cursor: pointer;
      font-size: 12.5px;
      font-weight: 700;
    }

    .urgency-pill.selected {
      background: var(--green-primary);
      color: #fff;
      border-color: var(--green-primary);
    }

    /* VIEW 4: PARABÉNS PERSONALIZADO AO FIM DE CADA ETAPA */
    .celebration-card {
      max-width: 600px;
      width: 100%;
      background: #ffffff;
      border: 1.5px solid #9ad4b2;
      border-radius: 22px;
      padding: 40px 36px;
      text-align: center;
      box-shadow: var(--shadow-md);
      position: relative;
      overflow: hidden;
    }

    .celeb-icon-ring {
      width: 76px;
      height: 76px;
      border-radius: 50%;
      background: var(--green-soft);
      color: var(--green-primary);
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 18px;
      position: relative;
      box-shadow: 0 0 0 8px rgba(33, 110, 67, 0.06);
    }

    .celeb-check-badge {
      position: absolute;
      bottom: -2px;
      right: -2px;
      width: 26px;
      height: 26px;
      border-radius: 50%;
      background: var(--green-primary);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 2px solid #fff;
    }

    .celeb-step-tag {
      display: inline-block;
      padding: 5px 14px;
      border-radius: 999px;
      background: #e6f5ec;
      color: var(--green-primary);
      font-size: 12px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 12px;
    }

    .celeb-title {
      font-size: 25px;
      font-weight: 800;
      color: var(--text-dark);
      line-height: 1.25;
      margin-bottom: 14px;
    }

    .celeb-copy {
      font-size: 15px;
      color: #4a5d52;
      line-height: 1.65;
      background: #f6fbf8;
      border: 1px solid #d5ebe0;
      padding: 18px 20px;
      border-radius: 14px;
      margin-bottom: 24px;
    }

    .next-stage-preview {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #ffffff;
      border: 1px solid var(--border-light);
      padding: 14px 18px;
      border-radius: 12px;
      margin-bottom: 24px;
      text-align: left;
    }

            options: ['Alta', 'Média', 'Baixa']
          },
          {
            sectionTitle: 'Visitas domiciliares',
            label: 'Grau de dificuldade de promover visitas das crianças acolhidas aos familiares (criança ir na casa do familiar)',
            helper: 'Inclui a 4ª opção "Não ocorre" conforme definido na reunião.',
            type: 'options',
            options: ['Alto', 'Médio', 'Baixo', 'Não ocorre']
          }
        ]
      },
      {
        id: 'plano_melhoria',
        number: 13,
        title: 'Plano de melhoria',
        icon: 'sprout',
        animType: 'sproutGrow', // Broto cresce no hover
        desc: 'Situação dos 5 ambientes, veículo, equipamentos, equipe, capacitação, captação e projetos adicionais.',
        totalQuestions: 12,
        status: 'pending',
        currentQ: 0,
        celebration: {
          title: '🎉 Fantástico! O Plano de Melhoria da sua casa foi registrado com sucesso!',
          copy: 'Saber exatamente quais reformas, veículos, equipamentos e profissionais são prioritários hoje nos permite conectar sua instituição a apoios reais e construir o nosso E-book diagnóstico da Fundação Net do Bem!'
        },
        sampleQuestions: [
          {
            sectionTitle: 'Plano de melhoria — Prioridades da casa',
            label: 'Equipamentos (Mobília, Eletrodomésticos e Eletroeletrônicos): selecione o nível de urgência e especifique abaixo',
            helper: 'Substitui o dropdown antigo por Seletor Visual de Nota (1 a 5) + Caixa Aberta para o E-book.',
            type: 'urgency_detail',
            placeholder: 'Especifique quais equipamentos são mais urgentes hoje (ex.: 2 geladeiras industriais, 10 beliches, 4 computadores para estudo)...'
          }
        ]
      }
    ];

    let currentMode = 'cards';
    let activeBlockIndex = 2;
    let currentFilter = 'all';

    // =========================================================================
    // MOTOR DE MICRO-ANIMAÇÕES GSAP (HOVER, CONCLUÍDO, NAVEGAÇÃO)
    // =========================================================================

    // 1. Animação de Hover Personalizada para Cada Tema de Card
    function bindCardHoverGSAP() {
      const cards = document.querySelectorAll('.stage-card');

      cards.forEach((card) => {
        const iconBox = card.querySelector('.card-icon-box');
        const iconSvg = iconBox ? iconBox.querySelector('svg') : null;
        const ctaBtn = card.querySelector('.card-cta');
        const ctaArrow = card.querySelector('.card-cta-arrow');
        const glow = card.querySelector('.card-glow');
        const animType = card.getAttribute('data-anim') || 'bounceScale';

        card.addEventListener('mouseenter', () => {
          // Elevação elástica suave do Card
          gsap.to(card, {
            y: -6,
            scale: 1.012,
            boxShadow: '0 16px 34px rgba(20, 65, 40, 0.11)',
            duration: 0.32,
            ease: 'power3.out',
            overwrite: 'auto'
          });

          // Brilho interno aparece
          if (glow) {
            gsap.to(glow, { opacity: 1, duration: 0.3 });
          }

          // Deslocamento da seta do botão CTA
          if (ctaArrow) {
            gsap.to(ctaArrow, { x: 4, duration: 0.25, ease: 'power2.out' });
          }

          // Destaque na caixa do ícone
          if (iconBox) {
            gsap.to(iconBox, {
              scale: 1.1,
              backgroundColor: '#d4ecde',
              duration: 0.3,
              ease: 'back.out(2)'
            });
          }

          // Micro-animação específica por tema do ícone (SVG)
          if (iconSvg) {
            gsap.killTweensOf(iconSvg);
            if (animType === 'spinGlow') {
              gsap.to(iconSvg, { rotation: 45, scale: 1.12, duration: 0.45, ease: 'back.out(1.7)' });
            } else if (animType === 'heartbeat') {
              gsap.fromTo(iconSvg,
                { scale: 1 },
                { scale: 1.24, duration: 0.18, yoyo: true, repeat: 3, ease: 'power1.inOut' }
              );
            } else if (animType === 'sproutGrow') {
              gsap.fromTo(iconSvg,
                { scaleY: 0.8, transformOrigin: 'bottom center' },
                { scaleY: 1.18, scaleX: 1.1, duration: 0.4, ease: 'elastic.out(1.2, 0.4)' }
              );
            } else if (animType === 'shieldPulse') {
              gsap.to(iconSvg, { rotationY: 25, scale: 1.14, duration: 0.35, ease: 'power2.out' });
            } else if (animType === 'capToss') {
              gsap.to(iconSvg, { y: -4, rotation: -10, duration: 0.25, yoyo: true, repeat: 1, ease: 'power2.out' });
            } else {
              gsap.to(iconSvg, { rotation: -8, scale: 1.12, duration: 0.25, yoyo: true, repeat: 1, ease: 'power2.out' });
            }
          }
        });

        card.addEventListener('mousemove', (e) => {
          if (!glow) return;
          const rect = card.getBoundingClientRect();
          const x = e.clientX - rect.left - 90;
          const y = e.clientY - rect.top - 90;
          gsap.to(glow, { x, y, duration: 0.25, ease: 'power2.out' });
        });

        card.addEventListener('mouseleave', () => {
          gsap.to(card, {
            y: 0,
            scale: 1,
            boxShadow: '0 2px 8px rgba(20, 50, 35, 0.04)',
            duration: 0.35,
            ease: 'power3.out',
            overwrite: 'auto'
          });

          if (glow) {
            gsap.to(glow, { opacity: 0, duration: 0.3 });
          }

          if (ctaArrow) {
            gsap.to(ctaArrow, { x: 0, duration: 0.25, ease: 'power2.out' });
          }

          if (iconBox) {
            const isPending = card.classList.contains('pending');
            gsap.to(iconBox, {
              scale: 1,
              backgroundColor: isPending ? '#f1f5f3' : '#e6f2eb',
              duration: 0.3,
              ease: 'power2.out'
            });
          }

          if (iconSvg) {
            gsap.to(iconSvg, {
              rotation: 0,
              rotationY: 0,
              scale: 1,
              scaleX: 1,
              scaleY: 1,
              y: 0,
              duration: 0.3,
              ease: 'power2.out'
            });
          }
        });
      });
    }

    // 2. Explosão de Partículas Verdes GSAP quando um Card é marcado como Concluído
    function spawnCompletionParticles(targetElement) {
      const rect = targetElement.getBoundingClientRect();
      const colors = ['#216e43', '#38a169', '#8fd1a8', '#f6ad55', '#195634'];

      for (let i = 0; i < 16; i++) {
        const dot = document.createElement('div');
        dot.className = 'gsap-particle';
        dot.style.backgroundColor = colors[i % colors.length];
        dot.style.left = `${rect.width / 2}px`;
        dot.style.top = `${rect.height / 2}px`;
        targetElement.appendChild(dot);

        const angle = (Math.PI * 2 * i) / 16;
        const distance = 45 + Math.random() * 55;

        gsap.fromTo(dot,
          { x: 0, y: 0, scale: 1.2, opacity: 1 },
          {
            x: Math.cos(angle) * distance,
            y: Math.sin(angle) * distance,
            scale: 0,
            opacity: 0,
            duration: 0.65 + Math.random() * 0.25,
            ease: 'power3.out',
            onComplete: () => dot.remove()
          }
        );
      }
    }

    // 3. Simular / Alternar estado de "Concluído" em tempo real com Timeline GSAP
    function toggleCompleteCardGSAP(event, idx) {
      event.stopPropagation();
      const block = BLOCKS[idx];
      const cardEl = document.getElementById(`stage-card-${idx}`);
      const fillEl = cardEl.querySelector('.card-progress-fill');
      const pctTextEl = cardEl.querySelector('.card-pct-number');
      const badgeEl = cardEl.querySelector('.status-badge');
      const iconBox = cardEl.querySelector('.card-icon-box');
      const ctaBtn = cardEl.querySelector('.card-cta-label');
      const checkBtn = cardEl.querySelector('.quick-complete-btn');

      if (block.status !== 'completed') {
        block.status = 'completed';
        cardEl.classList.remove('pending', 'in_progress');
        cardEl.classList.add('completed');

        // Dispara partículas no card
        spawnCompletionParticles(cardEl);

        // Timeline GSAP de Conclusão
        const tl = gsap.timeline();
        tl.to(cardEl, { scale: 1.035, borderColor: '#216e43', duration: 0.16, ease: 'power2.out' })
          .to(cardEl, { scale: 1, borderColor: '#9ad4b2', duration: 0.4, ease: 'elastic.out(1.2, 0.5)' });

        // Barra de progresso corre até 100% + contador numérico sobe
        const counterObj = { val: 0 };
        gsap.to(fillEl, { width: '100%', duration: 0.6, ease: 'power3.out' });
        gsap.to(counterObj, {
          val: 100,
          duration: 0.6,
          ease: 'power3.out',
          onUpdate: () => {
            if (pctTextEl) pctTextEl.textContent = `${Math.round(counterObj.val)}%`;
          }
        });

        // Badge faz pop elástico para "✓ Concluído"
        if (badgeEl) {
          badgeEl.className = 'status-badge completed';
          badgeEl.textContent = '✓ Concluído';
          gsap.fromTo(badgeEl, { scale: 0.5, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.45, ease: 'back.out(2.2)' });
        }

        if (iconBox) {
          gsap.fromTo(iconBox, { rotation: -15, scale: 0.85 }, { rotation: 0, scale: 1, backgroundColor: '#e6f2eb', color: '#216e43', duration: 0.45, ease: 'back.out(2)' });
        }

        if (ctaBtn) ctaBtn.textContent = 'Revisar etapa';
        if (checkBtn) {
          gsap.fromTo(checkBtn, { scale: 0.4 }, { scale: 1, duration: 0.35, ease: 'back.out(2)' });
        }

      } else {
        block.status = 'pending';
        cardEl.classList.remove('completed', 'in_progress');
        cardEl.classList.add('pending');

        gsap.to(fillEl, { width: '0%', duration: 0.35, ease: 'power2.out' });
        if (pctTextEl) pctTextEl.textContent = '0%';
        if (badgeEl) {
          badgeEl.className = 'status-badge pending';
          badgeEl.textContent = 'Não concluído';
          gsap.fromTo(badgeEl, { scale: 0.85 }, { scale: 1, duration: 0.25 });
        }
        if (ctaBtn) ctaBtn.textContent = 'Iniciar etapa';
      }

      // Atualiza contadores do cabeçalho e da sidebar com micro-pulo GSAP
      updateCountersHeaderGSAP();
      renderSidebar();
      pulseSavedBadge();
    }

    function updateCountersHeaderGSAP() {
      const doneCount = BLOCKS.filter(b => b.status === 'completed').length;
      const pendingCount = BLOCKS.length - doneCount;
      const totalPct = Math.round((doneCount / BLOCKS.length) * 100);

      const pillDone = document.getElementById('hub-stat-done');
      const pillPending = document.getElementById('hub-stat-pending');
      if (pillDone) {
        pillDone.innerHTML = `<i data-lucide="check-circle-2" style="width: 16px; height: 16px;"></i> ${doneCount} Concluídas (${totalPct}%)`;
        gsap.fromTo(pillDone, { scale: 1.12 }, { scale: 1, duration: 0.35, ease: 'back.out(2)' });
      }
      if (pillPending) {
        pillPending.innerHTML = `<i data-lucide="clock" style="width: 16px; height: 16px;"></i> ${pendingCount} Não concluídas`;
      }
      lucide.createIcons();
    }

    function pulseSavedBadge() {
      const badge = document.getElementById('saved-indicator');
      if (!badge) return;
      gsap.fromTo(badge,
        { scale: 1.2, color: '#216e43' },
        { scale: 1, color: '#527a63', duration: 0.45, ease: 'back.out(2)' }
      );
    }

    // 4. Transição de Navegação ao Clicar em um Card para Abrir o Tema
    function openBlockWithGSAP(idx, cardElement) {
      activeBlockIndex = idx;
      if (BLOCKS[idx].status === 'pending') {
        BLOCKS[idx].status = 'in_progress';
      }

      if (cardElement) {
        // Anima o card clicado dando zoom suave enquanto os outros recolhem
        const otherCards = Array.from(document.querySelectorAll('.stage-card')).filter(el => el !== cardElement);
        gsap.to(otherCards, { opacity: 0, scale: 0.94, duration: 0.2, ease: 'power2.in' });
        gsap.to(cardElement, {
          scale: 1.04,
          borderColor: '#216e43',
          duration: 0.24,
          ease: 'power2.out',
          onComplete: () => switchMode('form')
        });
      } else {
        switchMode('form');
      }
    }

    // =========================================================================
    // RENDERIZAÇÃO E TRANSIÇÕES ENTRE TELAS COM GSAP
    // =========================================================================

    function renderSidebar() {
      const nav = document.getElementById('sidebar-nav-list');
      const doneCount = BLOCKS.filter(b => b.status === 'completed').length;
      document.getElementById('sidebar-counter-badge').textContent = `${doneCount}/${BLOCKS.length} concluídos`;

      nav.innerHTML = BLOCKS.map((b, idx) => {
        const isActive = (currentMode === 'form' || currentMode === 'celebration') && idx === activeBlockIndex;
        let statusBadge = '';
        if (b.status === 'completed') {
          statusBadge = `<span class="nav-status-dot done" title="Concluído">✓</span>`;
        } else if (b.status === 'in_progress') {
          statusBadge = `<span class="nav-status-dot progress" title="Em andamento">•</span>`;
        }
        return `
          <button class="nav-item ${isActive ? 'active' : ''}" onclick="openBlockWithGSAP(${idx}, null)">
            <div class="nav-item-left">
              <i data-lucide="${b.icon}" style="width: 17px; height: 17px; flex-shrink:0;"></i>
              <span>${b.number}. ${b.title}</span>
            </div>
            ${statusBadge}
          </button>
        `;
      }).join('');
      lucide.createIcons();

      // Hover micro-slide nos itens da sidebar
      document.querySelectorAll('.sidebar-nav .nav-item').forEach(btn => {
        btn.addEventListener('mouseenter', () => {
          gsap.to(btn, { x: 4, duration: 0.2, ease: 'power2.out' });
        });
        btn.addEventListener('mouseleave', () => {
          gsap.to(btn, { x: 0, duration: 0.2, ease: 'power2.out' });
        });
      });
    }

    function switchMode(mode) {
      const container = document.getElementById('workspace-content');

      // Transição de saída suave antes de trocar a tela
      gsap.to(container, {
        opacity: 0,
        y: 8,
        duration: 0.15,
        ease: 'power2.in',
        onComplete: () => {
          currentMode = mode;
          document.querySelectorAll('.view-btn').forEach(btn => btn.classList.remove('active'));
          if (mode === 'cover') document.getElementById('btn-mode-cover').classList.add('active');
          if (mode === 'cards') document.getElementById('btn-mode-cards').classList.add('active');
          if (mode === 'form') document.getElementById('btn-mode-form').classList.add('active');
          if (mode === 'celebration') document.getElementById('btn-mode-celeb').classList.add('active');

          const bottomBar = document.getElementById('bottom-progress-bar');
          bottomBar.style.display = (mode === 'form') ? 'flex' : 'none';

          renderSidebar();
          renderMainWorkspace();

          gsap.fromTo(container,
            { opacity: 0, y: 12 },
            { opacity: 1, y: 0, duration: 0.3, ease: 'power3.out' }
          );
        }
      });
    }

    function filterCards(filter) {
      currentFilter = filter;
      renderMainWorkspace();
    }

    function renderMainWorkspace() {
      const container = document.getElementById('workspace-content');

      // 1. CAPA
      if (currentMode === 'cover') {
        container.innerHTML = `
          <div class="cover-container" id="cover-card">
            <div class="cover-pill">
              <i data-lucide="heart-handshake" style="width: 15px; height: 15px;"></i>
              Pesquisa Oficial • Fundação Net do Bem
            </div>
            <h1 class="cover-title">Um retrato cuidadoso de quem acolhe, protege e transforma vidas.</h1>
            <p class="cover-desc">
              Esta pesquisa mapeia a realidade estrutural, humana e financeira das instituições de acolhimento.
              Suas respostas ficam salvas automaticamente e você pode navegar livremente pelos <strong>cards de etapas</strong> no seu próprio ritmo.
            </p>
            <div class="cover-highlights">
              <div class="highlight-box">
                <i data-lucide="layout-grid" style="width: 18px; height: 18px; color: var(--green-primary);"></i>
                <strong>13 Blocos Curtos</strong>
                <span>Média rápida de ~10 a 15 perguntas por etapa</span>
              </div>
              <div class="highlight-box">
                <i data-lucide="save" style="width: 18px; height: 18px; color: var(--green-primary);"></i>
                <strong>Salvo por ID/Login</strong>
                <span>Pause quando quiser e retome exatamente de onde parou</span>
              </div>
              <div class="highlight-box">
                <i data-lucide="book-open-check" style="width: 18px; height: 18px; color: var(--green-primary);"></i>
                <strong>E-book & Rede</strong>
                <span>Dados que geram visibilidade e conectam apoios reais</span>
              </div>
            </div>
            <button class="btn-primary" style="width: 100%; justify-content: center; padding: 15px; font-size: 16px;" onclick="switchMode('cards')">
              Entrar e Ver Painel de Etapas (Cards)
              <i data-lucide="arrow-right" style="width: 18px; height: 18px;"></i>
            </button>
          </div>
        `;
        lucide.createIcons();
        gsap.from('.cover-container > *', {
          y: 16,
          opacity: 0,
          stagger: 0.07,
          duration: 0.45,
          ease: 'power3.out'
        });
        return;
      }

      // 2. VISÃO DE CARDS COM MICRO-ANIMAÇÕES GSAP
      if (currentMode === 'cards') {
        const doneCount = BLOCKS.filter(b => b.status === 'completed').length;
        const inProgressCount = BLOCKS.filter(b => b.status === 'in_progress').length;
        const pendingCount = BLOCKS.filter(b => b.status === 'pending').length;
        const totalPct = Math.round((doneCount / BLOCKS.length) * 100);

        const filteredBlocks = BLOCKS.filter(b => {
          if (currentFilter === 'all') return true;
          if (currentFilter === 'completed') return b.status === 'completed';
          if (currentFilter === 'pending') return b.status !== 'completed';
          return true;
        });

        container.innerHTML = `
          <div class="cards-hub-container">
            <div class="hub-header">
              <div class="hub-header-left">
                <h2>Painel de Etapas da Pesquisa</h2>
                <p>Passe o mouse sobre os cards para ver as micro-animações GSAP ou clique no botão <strong>✓</strong> no topo direito de qualquer card para testar a animação de <strong>Concluído</strong>.</p>
              </div>
              <div class="hub-stats">
                <div class="stat-pill done" id="hub-stat-done">
                  <i data-lucide="check-circle-2" style="width: 16px; height: 16px;"></i>
                  ${doneCount} Concluídas (${totalPct}%)
                </div>
                <div class="stat-pill pending" id="hub-stat-pending">
                  <i data-lucide="clock" style="width: 16px; height: 16px;"></i>
                  ${inProgressCount + pendingCount} Não concluídas
                </div>
              </div>
            </div>

            <div class="filter-tabs">
              <div class="filter-tabs-left">
                <button class="filter-tab ${currentFilter === 'all' ? 'active' : ''}" onclick="filterCards('all')">
                  Todas as etapas (${BLOCKS.length})
                </button>
                <button class="filter-tab ${currentFilter === 'completed' ? 'active' : ''}" onclick="filterCards('completed')">
                  ✓ Concluídas (${doneCount})
                </button>
                <button class="filter-tab ${currentFilter === 'pending' ? 'active' : ''}" onclick="filterCards('pending')">
                  Não concluídas (${inProgressCount + pendingCount})
                </button>
              </div>
              <span style="font-size: 12px; color: var(--green-primary); font-weight: 600;">
                ✨ Dica: Clique no ícone ✓ de qualquer card para simular o efeito GSAP de conclusão
              </span>
            </div>

            <div class="cards-grid">
              ${filteredBlocks.map((b) => {
                const realIdx = BLOCKS.findIndex(item => item.id === b.id);
                const pct = b.status === 'completed' ? 100 : (b.status === 'in_progress' ? 40 : 0);
                const statusLabel = b.status === 'completed'
                  ? '✓ Concluído'
                  : (b.status === 'in_progress' ? 'Em andamento' : 'Não concluído');
                const ctaText = b.status === 'completed'
                  ? 'Revisar etapa'
                  : (b.status === 'in_progress' ? 'Continuar etapa' : 'Iniciar etapa');

                return `
                  <div class="stage-card ${b.status}" id="stage-card-${realIdx}" data-anim="${b.animType}" onclick="openBlockWithGSAP(${realIdx}, this)">
                    <div class="card-glow"></div>
                    <div>
                      <div class="card-top">
                        <div class="card-icon-box">
                          <i data-lucide="${b.icon}" style="width: 22px; height: 22px;"></i>
                        </div>
                        <div class="card-top-right">
                          <span class="status-badge ${b.status}">${statusLabel}</span>
                          <button type="button" class="quick-complete-btn" title="Testar animação GSAP de Concluído" onclick="toggleCompleteCardGSAP(event, ${realIdx})">
                            <i data-lucide="check" style="width: 13px; height: 13px;"></i>
                          </button>
                        </div>
                      </div>
                      <div style="margin-top: 14px;">
                        <div class="card-StepLabel">Etapa ${b.number} de ${BLOCKS.length}</div>
                        <h3 class="card-title">${b.title}</h3>
                        <p class="card-desc">${b.desc}</p>
                      </div>
                    </div>

                    <div>
                      <div class="card-progress-wrap" style="margin-bottom: 12px;">
                        <div class="card-progress-meta">
                          <span>${b.totalQuestions} perguntas</span>
                          <span class="card-pct-number">${pct}%</span>
                        </div>
                        <div class="card-progress-bar">
                          <div class="card-progress-fill" data-target-pct="${pct}"></div>
                        </div>
                      </div>
                      <button type="button" class="card-cta">
                        <span class="card-cta-label">${ctaText}</span>
                        <span class="card-cta-arrow"><i data-lucide="arrow-right" style="width: 14px; height: 14px;"></i></span>
                      </button>
                    </div>
                  </div>
                `;
              }).join('')}
            </div>
          </div>
        `;
        lucide.createIcons();

        // Animação GSAP Stagger de Entrada dos Cards + Preenchimento das Barras
        gsap.fromTo('.stage-card',
          { opacity: 0, y: 24, scale: 0.96 },
          {
            opacity: 1,
            y: 0,
            scale: 1,
            duration: 0.48,
            stagger: 0.045,
            ease: 'back.out(1.3)',
            onComplete: () => {
              document.querySelectorAll('.card-progress-fill').forEach(bar => {
                const target = bar.getAttribute('data-target-pct') || 0;
                gsap.to(bar, { width: `${target}%`, duration: 0.65, ease: 'power3.out' });
              });
            }
          }
        );

        // Ativa os listeners de Hover GSAP por tema
        bindCardHoverGSAP();
        return;
      }

      // 3. MODO FORMULÁRIO (Com transição GSAP entre perguntas)
      if (currentMode === 'form') {
        const block = BLOCKS[activeBlockIndex];
        const qIndex = block.currentQ || 0;
        const q = block.sampleQuestions[qIndex];
        const totalSample = block.sampleQuestions.length;
        const pct = Math.round(((qIndex + 1) / totalSample) * 100);

        document.getElementById('progress-q-text').textContent = `Pergunta ${qIndex + 1} de ${totalSample} (amostra deste bloco)`;
        document.getElementById('progress-pct-text').textContent = `${pct}% preenchido`;
        gsap.to('#progress-bar-fill', { width: `${pct}%`, duration: 0.45, ease: 'power3.out' });
        document.getElementById('btn-next-label').textContent = (qIndex === totalSample - 1) ? 'Concluir Etapa' : 'Continuar';

        let inputHtml = '';
        if (q.type === 'text') {
          inputHtml = `
            <input type="text" class="q-input" placeholder="${q.placeholder}" oninput="if(this.value && activeBlockIndex===0 && ${qIndex}===0){ document.getElementById('display-entity-name').textContent = this.value; }" />
            <span class="q-required">*Obrigatório</span>
          `;
        } else if (q.type === 'textarea') {
          inputHtml = `
            <textarea rows="4" maxlength="300" class="q-textarea" placeholder="${q.placeholder}"></textarea>
            <span class="q-required">Limite máximo: 300 caracteres</span>
          `;
        } else if (q.type === 'options') {
          inputHtml = `
            <div class="options-stack">
              ${q.options.map(opt => `
                <button type="button" class="option-btn" onclick="selectOptionGSAP(this)">
                  <span>${opt}</span>
                  <i data-lucide="check-circle" style="width: 18px; height: 18px; opacity: 0.45;"></i>
                </button>
              `).join('')}
            </div>
          `;
        } else if (q.type === 'quintoandar') {
          inputHtml = `
            <div class="qa-grid">
              ${q.items.map(item => `
                <div class="qa-counter-card">
                  <span>${item}</span>
                  <div class="counter-controls">
                    <button type="button" class="counter-btn" onclick="bumpCounterGSAP(this, -1)">-</button>
                    <strong style="min-width: 20px; text-align: center;">2</strong>
                    <button type="button" class="counter-btn" onclick="bumpCounterGSAP(this, 1)">+</button>
                  </div>
                </div>
              `).join('')}
            </div>
          `;
        } else if (q.type === 'urgency_detail') {
          inputHtml = `
            <div class="urgency-scale">
              ${['1 • Baixa', '2 • Pouca', '3 • Média', '4 • Alta', '5 • Urgente'].map((lvl, i) => `
                <div class="urgency-pill ${i===4 ? 'selected' : ''}" onclick="selectUrgencyGSAP(this)">
                  ${lvl}
                </div>
              `).join('')}
            </div>
            <textarea rows="3" class="q-textarea" placeholder="${q.placeholder}"></textarea>
          `;
        }

        container.innerHTML = `
          <div class="question-box" id="active-question-box">
            <div class="q-header">
              <div class="q-icon-badge" id="form-block-icon">
                <i data-lucide="${block.icon}" style="width: 22px; height: 22px;"></i>
              </div>
              <div class="q-block-meta">
                <span>Bloco ${block.number} de ${BLOCKS.length}</span>
                <strong>${block.title}</strong>
              </div>
            </div>

            <h1 class="q-section-title">${q.sectionTitle}</h1>
            <label class="q-label">${q.label}</label>
            <p class="q-helper">${q.helper}</p>
            ${inputHtml}
          </div>
        `;
        lucide.createIcons();

        gsap.fromTo('#active-question-box > *',
          { opacity: 0, x: 18 },
          { opacity: 1, x: 0, duration: 0.35, stagger: 0.05, ease: 'power3.out' }
        );
        return;
      }

      // 4. TELA DE PARABÉNS COM TIMELINE GSAP COMPLETA
      if (currentMode === 'celebration') {
        const block = BLOCKS[activeBlockIndex];
        const nextBlock = BLOCKS[activeBlockIndex + 1] || BLOCKS[0];
        const doneCount = BLOCKS.filter(b => b.status === 'completed').length;

        container.innerHTML = `
          <div class="celebration-card" id="celebration-card-box">
            <div class="celeb-icon-ring" id="celeb-ring">
              <i data-lucide="${block.icon}" style="width: 34px; height: 34px;"></i>
              <div class="celeb-check-badge" id="celeb-check">
                <i data-lucide="check" style="width: 15px; height: 15px;"></i>
              </div>
            </div>

            <span class="celeb-step-tag">Etapa ${block.number} de ${BLOCKS.length} Concluída • ${doneCount}/${BLOCKS.length} Completas</span>
            <h2 class="celeb-title">${block.celebration.title}</h2>
            <p class="celeb-copy">“${block.celebration.copy}”</p>

            <div class="next-stage-preview">
              <div class="next-stage-left">
                <div class="card-icon-box" style="width: 38px; height: 38px;">
                  <i data-lucide="${nextBlock.icon}" style="width: 19px; height: 19px;"></i>
                </div>
                <div>
                  <small>Próxima Etapa Sugerida</small>
                  <strong>Etapa ${nextBlock.number}: ${nextBlock.title}</strong>
                </div>
              </div>
              <span style="font-size: 12px; font-weight: 700; color: var(--green-primary);">${nextBlock.totalQuestions} perguntas</span>
            </div>

            <div style="display: flex; flex-direction: column; gap: 10px;">
              <button class="btn-primary" style="width: 100%; justify-content: center; padding: 14px;" onclick="advanceToNextBlock()">
                Avançar para ${nextBlock.title}
                <i data-lucide="arrow-right" style="width: 18px; height: 18px;"></i>
              </button>
              <button class="btn-secondary" style="width: 100%; justify-content: center;" onclick="switchMode('cards')">
                <i data-lucide="layout-grid" style="width: 16px; height: 16px;"></i>
                Voltar ao Painel de Cards (Concluídos / Pendentes)
              </button>
            </div>
          </div>
        `;
        lucide.createIcons();

        const celebBox = document.getElementById('celebration-card-box');
        spawnCompletionParticles(celebBox);

        const tl = gsap.timeline();
        tl.fromTo(celebBox, { scale: 0.9, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.42, ease: 'back.out(1.6)' })
          .fromTo('#celeb-ring', { scale: 0, rotation: -35 }, { scale: 1, rotation: 0, duration: 0.5, ease: 'elastic.out(1.1, 0.5)' }, '-=0.2')
          .fromTo('#celeb-check', { scale: 0 }, { scale: 1, duration: 0.35, ease: 'back.out(2.5)' }, '-=0.25')
          .fromTo('.celebration-card > *:not(#celeb-ring)', { y: 14, opacity: 0 }, { y: 0, opacity: 1, stagger: 0.06, duration: 0.35, ease: 'power2.out' }, '-=0.3');
      }
    }

    // Interações GSAP dentro do Formulário
    function selectOptionGSAP(btn) {
      btn.parentElement.querySelectorAll('.option-btn').forEach(el => el.classList.remove('selected'));
      btn.classList.add('selected');
      gsap.fromTo(btn, { scale: 0.97 }, { scale: 1, duration: 0.3, ease: 'back.out(2)' });
      pulseSavedBadge();
    }

    function selectUrgencyGSAP(pill) {
      pill.parentElement.querySelectorAll('.urgency-pill').forEach(el => el.classList.remove('selected'));
      pill.classList.add('selected');
      gsap.fromTo(pill, { scale: 0.9 }, { scale: 1, duration: 0.3, ease: 'back.out(2.2)' });
      pulseSavedBadge();
    }

    function bumpCounterGSAP(btn, delta) {
      const numEl = delta < 0 ? btn.nextElementSibling : btn.previousElementSibling;
      const nextVal = Math.max(0, parseInt(numEl.textContent) + delta);
      numEl.textContent = nextVal;
      gsap.fromTo(numEl, { scale: 1.35, color: '#216e43' }, { scale: 1, color: '#1d2b24', duration: 0.3, ease: 'back.out(2)' });
      pulseSavedBadge();
    }

    function nextQuestion() {
      const block = BLOCKS[activeBlockIndex];
      const box = document.getElementById('active-question-box');

      if (block.currentQ < block.sampleQuestions.length - 1) {
        gsap.to(box, {
          opacity: 0,
          x: -24,
          duration: 0.18,
          ease: 'power2.in',
          onComplete: () => {
            block.currentQ++;
            renderMainWorkspace();
          }
        });
      } else {
        block.status = 'completed';
        block.currentQ = 0;
        switchMode('celebration');
      }
    }

    function prevQuestion() {
      const block = BLOCKS[activeBlockIndex];
      const box = document.getElementById('active-question-box');

      if (block.currentQ > 0) {
        gsap.to(box, {
          opacity: 0,
          x: 24,
          duration: 0.18,
          ease: 'power2.in',
          onComplete: () => {
            block.currentQ--;
            renderMainWorkspace();
          }
        });
      } else {
        switchMode('cards');
      }
    }

    function triggerSampleCelebration() {
      BLOCKS[activeBlockIndex].status = 'completed';
      switchMode('celebration');
    }

    function advanceToNextBlock() {
      if (activeBlockIndex < BLOCKS.length - 1) {
        activeBlockIndex++;
      } else {
        activeBlockIndex = 0;
      }
      if (BLOCKS[activeBlockIndex].status === 'pending') {
        BLOCKS[activeBlockIndex].status = 'in_progress';
      }
      switchMode('form');
    }

    // Inicializa aplicação
    renderSidebar();
    renderMainWorkspace();
  </script>
</body>
</html>
